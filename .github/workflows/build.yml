# Build and publish the Ruust managed base images to GHCR (public).
#
# Each engine and major version is built from its Dockerfile (FROM the official
# image + our thin layer) and pushed to ghcr.io/ruustrun/<engine>:<version>, which
# the Ruust fleet pulls with no credentials. Building here means the one Docker Hub
# pull happens in CI (monthly / on demand), never per host, so hosts are never rate
# limited.
#
# linux/amd64 today (the fleet arch). Runs on push, monthly (upstream security
# patches on a predictable cadence), and on demand. British English. No em dashes.

name: Build base images

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR is lower case.
  OWNER: ruustrun

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Trivy results go to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      # Serialise: a burst of fresh-package blob uploads trips GHCR's rate limit.
      max-parallel: 1
      matrix:
        include:
          # Kept in step with DATABASE_ENGINES.versions in the control plane.
          # Publish a version HERE before adding it there: the control plane builds the
          # image ref from the tag, so a version offered before its tag exists gives a
          # DB Egg that cannot pull.
          - { engine: postgres, version: '18' }
          - { engine: postgres, version: '17' }
          - { engine: postgres, version: '16' }
          - { engine: postgres, version: '15' }
          - { engine: postgres, version: '14' }
          # Redis 8 is the first release to offer AGPLv3 alongside RSALv2/SSPLv1.
          # 7.4 (which the `7` tag resolves to) offers only the latter two, and both
          # restrict offering the software as a managed service, which is what we do.
          - { engine: redis, version: '8' }
          - { engine: redis, version: '7' }
          - { engine: redis, version: '6' }
          # Ollama has no major-version line we want to track, so we mirror upstream
          # `latest` and publish it as our own `0`, which moves only when this
          # workflow runs. `tag` overrides the published tag; the others publish at
          # their version.
          - { engine: ollama, version: 'latest', tag: '0' }
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build ${{ matrix.engine }}:${{ matrix.version }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.engine }}"
          TAG="${{ matrix.tag || matrix.version }}"
          docker build --build-arg VERSION=${{ matrix.version }} -t "${IMAGE}:${TAG}" "${{ matrix.engine }}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      # Scanned, and deliberately NOT gated on. These images are a passthrough of the
      # official ones: when upstream ships a fixable CVE we cannot patch it here, so
      # failing the job would only withhold the OTHER versions' patches from the same
      # rebuild while making nothing safer. The freshly built image is never worse than
      # the one already in the registry, so it publishes either way and the finding
      # goes to the Security tab, where it is visible and keeps its history.
      #
      # What a finding actually means: upstream has a fix we are not carrying yet, so
      # either the rebuild needs running sooner, or that major is old enough to retire
      # from DATABASE_ENGINES.
      - name: Scan ${{ matrix.engine }}:${{ matrix.version }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: sarif
          output: trivy-${{ matrix.engine }}-${{ matrix.version }}.sarif
          severity: HIGH,CRITICAL
          # Vulnerabilities only: a base image inherits its distro's config defaults
          # and those are not ours to change.
          scanners: vuln
          # Unfixed CVEs are noise we can do nothing about. A FIXABLE one is the
          # signal: upstream has a patch and we are not carrying it.
          ignore-unfixed: true
          exit-code: '0'

      - name: File the findings under Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.engine }}-${{ matrix.version }}.sarif
          category: trivy-${{ matrix.engine }}-${{ matrix.version }}

      - name: Push ${{ matrix.engine }}:${{ matrix.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${TAG}"
          echo "Published ${IMAGE}:${TAG}"

  publicise:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Make the packages public
        # New GHCR packages are private by default; the fleet has no credentials, so
        # the packages must be public. The default GITHUB_TOKEN often cannot change
        # org package visibility, so this is best effort: if it does not take, set
        # each package public once in the GHCR UI (Packages > postgres / redis /
        # ollama > visibility). It stays public through future pushes.
        run: |
          for pkg in postgres redis ollama; do
            curl -sS -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/RuustRun/packages/container/${pkg}/visibility" \
              -d '{"visibility":"public"}' \
              && echo "Attempted ${pkg} public" \
              || echo "::warning::Could not set ${pkg} public via API. Set it once in the GHCR UI."
          done
