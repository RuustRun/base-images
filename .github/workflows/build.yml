# Build and publish the Ruust managed database base images to GHCR (public).
#
# Each engine and major version is built from its Dockerfile (FROM the official
# image + our thin layer) and pushed to ghcr.io/ruustrun/<engine>:<version>, which
# the Ruust fleet pulls with no credentials. Building here means the one Docker Hub
# pull happens in CI (monthly / on demand), never per host, so hosts are never rate
# limited.
#
# linux/amd64 today (the fleet arch). Runs on push, monthly (upstream security
# patches on a predictable cadence), and on demand. British English. No em dashes.

name: Build base images

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR is lower case.
  OWNER: ruustrun

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Serialise: a burst of fresh-package blob uploads trips GHCR's rate limit.
      max-parallel: 1
      matrix:
        include:
          # Kept in step with DATABASE_ENGINES.versions in the control plane.
          - { engine: postgres, version: '16' }
          - { engine: postgres, version: '15' }
          - { engine: postgres, version: '14' }
          - { engine: redis, version: '7' }
          - { engine: redis, version: '6' }
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.engine }}:${{ matrix.version }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.engine }}"
          docker build --build-arg VERSION=${{ matrix.version }} -t "${IMAGE}:${{ matrix.version }}" "${{ matrix.engine }}"
          docker push "${IMAGE}:${{ matrix.version }}"
          echo "Published ${IMAGE}:${{ matrix.version }}"

  publicise:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Make the packages public
        # New GHCR packages are private by default; the fleet has no credentials, so
        # the packages must be public. The default GITHUB_TOKEN often cannot change
        # org package visibility, so this is best effort: if it does not take, set
        # each package public once in the GHCR UI (Packages > postgres / redis >
        # visibility). It stays public through future pushes.
        run: |
          for pkg in postgres redis; do
            curl -sS -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/RuustRun/packages/container/${pkg}/visibility" \
              -d '{"visibility":"public"}' \
              && echo "Attempted ${pkg} public" \
              || echo "::warning::Could not set ${pkg} public via API. Set it once in the GHCR UI."
          done
